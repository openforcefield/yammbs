[workspace]
name = "yammbs"
channels = [ "conda-forge", "openeye" ]
platforms = [ "linux-64", "osx-arm64" ]

[dependencies]
pip = "*"
numpy = "2.2.*"
setuptools_scm = "*"
pydantic = "2.*"
openff-toolkit-base = "0.18.*"
openff-qcsubmit = "0.57.*"
qcportal = "~=0.55"
openeye-toolkits = "*"
openmmforcefields = "*"
rdkit = ">=2024,!=2024.03.6,!=2024.09.1"
pytorch = "2.8.*"  # aimnet2 at least needs 2.8+, possibly more
openmm = "8.5.*"
openmm-ml = "*"
MDAnalysis = "*"
# add back when merged https://github.com/openforcefield/smirnoff-plugins/pull/76
# smirnoff-plugins
# de-forcefields ~=1.0.3
click = "*"
scipy = "*"
seaborn = "*"
bokeh = "*"
panel = "*"
rich = ">=12.1,<14.0" # solver would otherwise bring down 15.0.0, but rich >=12.1,<14.0 <- cached-path <- orb-models 0.6.x

[environments]
py312 = [ "py312", "test", "typing" ]
dev = [ "py312", "test", "typing", "dev" ]
docs = [ "py312", "docs" ]

[feature.dev.pypi-dependencies]
pre-commit = "*"
ipython = "*"
ipdb = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-randomly = "*"
pytest-timeout = "*"

[feature.typing.dependencies]
mypy = "*"
typing-extensions = "*"
types-cffi = "*"
types-click = "*"
types-colorama = "*"
types-docutils = "*"
types-Pygments = "*"
types-python-dateutil = "*"
types-pytz = "*"
types-pywin32 = "*"
types-setuptools = "*"
types-tqdm = "*"
sqlalchemy-stubs = "*"
pandas-stubs = "*"
scipy-stubs = "*"

[feature.docs.dependencies]
sphinx = "6.*"
myst-nb = "1.*"
myst-parser = "*"
docutils = "*"
sphinx-notfound-page = "*"
libsass = "*"  # Pre-built libsass to avoid compilation issues
# Additional packages needed for building docs
openff-toolkit = "*"  # Full toolkit instead of base for docs
openff-interchange = "0.4.*"
openff-units = "*"
openff-utilities = "*"
geometric = "1.*"
networkx = "*"
mdtraj = "*"
nglview = "*"

[feature.docs.pypi-dependencies]
openff-sphinx-theme = { git = "https://github.com/openforcefield/openff-sphinx-theme.git", branch = "main" }

[pypi-dependencies]
aimnet = "==0.1.1"
orb-models = "==0.6.*"
yammbs = { path = ".", editable = true }

[tasks]
run_mypy = { cmd = "python -m mypy -p yammbs" }
run_tests = { cmd = "python -m pytest yammbs -x --durations=20 -n logical" }
build_docs = { cmd = "sphinx-build -b html -j auto docs docs/_build/html" }

name: Build Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up virtual environment
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.68.1
          environments: docs
          frozen: true

      - name: Install PASCAL Compiler
        run: sudo apt-get install fp-compiler

      - name: Install checkmol
        run: |
          curl https://homepage.univie.ac.at/norbert.haider/download/chemistry/checkmol/checkmol.pas > checkmol.pas
          fpc checkmol.pas -S2
          echo $(pwd) >> $GITHUB_PATH

      - name: Environment Information
        run: pixi info

      - name: Build documentation
        run: |
          rm -rf docs/_autosummary docs/api/generated docs/_build/html
          pixi run -e docs build_docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 7

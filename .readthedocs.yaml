# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  apt_packages:
    - fp-compiler  # PASCAL compiler for checkmol
  tools:
    python: "3.12"

python:
  # Use pixi for dependency management
  install:
    - method: pixi
      path: .
      environment: docs

jobs:
  pre_build:
    - bash -c 'curl https://homepage.univie.ac.at/norbert.haider/download/chemistry/checkmol/checkmol.pas > /tmp/checkmol.pas'
    - bash -c 'cd /tmp && fpc checkmol.pas -S2 && cp checkmol /usr/local/bin/'

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
- pdf
